name: Test sphinx build options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Sphinx docs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-docs"
          cat > "$GITHUB_WORKSPACE/test-docs/conf.py" << 'CONFEOF'
          project = 'Test Project'
          author = 'Test Author'
          extensions = []
          html_theme = 'alabaster'
          CONFEOF
          cat > "$GITHUB_WORKSPACE/test-docs/index.rst" << 'RSTEOF'
          Test Documentation
          ==================

          Hello, world!
          RSTEOF
          echo "Created test docs at $GITHUB_WORKSPACE/test-docs"
          ls -la "$GITHUB_WORKSPACE/test-docs"

      - id: action
        uses: .
        with:
          documentation_path: ./test-docs
          requirements_path: ''
          pyproject_extras: ''
          sphinx_build_options: '-v'
          checkout: 'false'
          publish: 'false'
          cache: 'false'

      - name: Assert artifact output is set
        env:
          ARTIFACT: ${{ steps.action.outputs.artifact }}
        run: |
          echo "artifact: $ARTIFACT"
          if [ -z "$ARTIFACT" ]; then
            echo "FAIL: artifact output is empty"
            exit 1
          fi
          echo "PASS: artifact output is set to $ARTIFACT"

      - name: Assert HTML output was generated
        env:
          ARTIFACT: ${{ steps.action.outputs.artifact }}
        run: |
          echo "Checking for index.html in: $ARTIFACT"
          if [ ! -f "$ARTIFACT/index.html" ]; then
            echo "FAIL: index.html not found in artifact directory"
            ls -la "$ARTIFACT" || true
            exit 1
          fi
          echo "PASS: index.html found"
