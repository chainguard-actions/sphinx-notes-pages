name: Test build failure on docs without conf.py
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          documentation_path: tests/fixtures/broken-docs
          requirements_path: ''
          checkout: 'false'
          publish: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACT: ${{ steps.action.outputs.artifact }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact: $ARTIFACT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when conf.py is missing"
            exit 1
          fi
          if [ -n "$ARTIFACT" ]; then
            echo "FAIL: artifact should be empty on failure"
            exit 1
          fi
          echo "PASS"
